<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Vacuum Wiki | 扫地机器人项目</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a28;
            --bg-card: #161622;
            --border: #2a2a3e;
            --border-hover: #3a3a5e;
            --text-primary: #e8e8f0;
            --text-secondary: #9090a8;
            --text-muted: #606078;
            --accent: #5eead4;
            --accent-dim: #5eead433;
            --accent-glow: #5eead422;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
            --info: #60a5fa;
            --status-planning: #fbbf24;
            --status-progress: #60a5fa;
            --status-review: #a78bfa;
            --status-done: #4ade80;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #0d9488;
            --accent-dim: #0d948833;
            --accent-glow: #0d948822;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Layout */
        .app {
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: 60px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.3px;
        }

        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), #2dd4bf);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        .logo span { opacity: 0.6; font-weight: 400; margin-left: 4px; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px 8px 36px;
            color: var(--text-primary);
            font-size: 13px;
            width: 240px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px; top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            opacity: 0.5;
        }

        .theme-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px 0;
        }

        .nav-section {
            margin-bottom: 8px;
        }

        .nav-header {
            padding: 8px 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 20px;
            margin: 0 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13.5px;
            color: var(--text-secondary);
            transition: all 0.15s;
            position: relative;
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .nav-item .icon { font-size: 16px; width: 22px; text-align: center; }

        .nav-item .count {
            margin-left: auto;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .nav-item.active .count {
            background: var(--accent);
            color: var(--bg-primary);
        }

        /* Progress indicator on nav */
        .nav-progress {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 0 2px 2px 0;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .nav-item.active .nav-progress { opacity: 1; }

        /* Main Content */
        .main {
            overflow-y: auto;
            padding: 32px 40px;
            scroll-behavior: smooth;
        }

        /* Dashboard View */
        .dashboard {
            max-width: 1200px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Progress Overview */
        .progress-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #2dd4bf);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .module-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .module-card:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .module-name {
            font-weight: 600;
            font-size: 14px;
        }

        .module-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .status-待启动 { background: var(--bg-primary); color: var(--text-muted); border: 1px solid var(--border); }
        .status-进行中 { background: #60a5fa22; color: var(--status-progress); }
        .status-审核中 { background: #a78bfa22; color: var(--status-review); }
        .status-已完成 { background: #4ade8022; color: var(--status-done); }

        .module-desc {
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .module-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .module-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-bar {
            width: 60px;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 2px;
            overflow: hidden;
        }

        .mini-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s;
        }

        /* Content View */
        .content-view {
            max-width: 900px;
        }

        .content-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .content-nav button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .content-nav button:hover, .content-nav button.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        .doc-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            line-height: 1.7;
        }

        .doc-content h1 {
            font-size: 24px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .doc-content h2 {
            font-size: 18px;
            margin: 28px 0 12px;
            color: var(--accent);
        }

        .doc-content h3 {
            font-size: 15px;
            margin: 20px 0 10px;
            color: var(--text-primary);
        }

        .doc-content p {
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .doc-content ul, .doc-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .doc-content li {
            margin: 6px 0;
            color: var(--text-secondary);
        }

        .doc-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 13.5px;
        }

        .doc-content th, .doc-content td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .doc-content th {
            background: var(--bg-tertiary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }

        .doc-content tr:hover td {
            background: var(--bg-tertiary);
        }

        .doc-content code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--accent);
        }

        .doc-content pre {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 16px 0;
        }

        .doc-content pre code {
            background: none;
            padding: 0;
        }

        .doc-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .doc-content img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin: 16px 0;
            border: 1px solid var(--border);
            display: block;
            height: auto;
        }

        .doc-content .table-wrap {
            overflow-x: auto;
            margin: 16px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .doc-content .table-wrap table {
            margin: 0;
            min-width: 100%;
        }

        .doc-content a {
            color: var(--accent);
            text-decoration: none;
        }

        .doc-content a:hover {
            text-decoration: underline;
        }

        .doc-meta {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .doc-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Search Results */
        .search-results {
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .result-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .result-item:hover {
            border-color: var(--accent);
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--accent);
        }

        .result-snippet {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .result-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Mobile */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: 60px 1fr;
            }

            .sidebar {
                position: fixed;
                left: 0; top: 60px; bottom: 0;
                width: 260px;
                z-index: 99;
                transform: translateX(-100%);
                transition: transform 0.3s;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu-btn { display: block; }

            .main { padding: 16px; }

            .content-view { max-width: 100%; }

            .doc-content {
                padding: 20px;
                font-size: 14px;
            }

            .doc-content h1 { font-size: 20px; }
            .doc-content h2 { font-size: 16px; margin: 20px 0 10px; }
            .doc-content h3 { font-size: 14px; }
            .doc-content table { font-size: 12px; }
            .doc-content th, .doc-content td { padding: 6px 8px; }

            .stats-grid { grid-template-columns: repeat(2, 1fr); }

            .module-grid { grid-template-columns: 1fr; }

            .search-box input { width: 140px; }

            .header { padding: 0 12px; }
            .logo span { display: none; }
        }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-value { font-size: 22px; }
            .doc-content { padding: 16px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.4s ease forwards;
        }

        /* Priority badges */
        .priority-high { color: var(--error); }
        .priority-medium { color: var(--warning); }
        .priority-low { color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                <div class="logo">
                    <div class="logo-icon">🤖</div>
                    <div>Robot Vacuum Wiki <span>v0.4.0</span></div>
                </div>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索文档、模块..." oninput="handleSearch(this.value)">
                </div>
                <button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
            </div>
        </header>

        <aside class="sidebar" id="sidebar">
            <div class="nav-section">
                <div class="nav-header">导航</div>
                <div class="nav-item active" onclick="showView('dashboard')" data-view="dashboard">
                    <div class="nav-progress"></div>
                    <span class="icon">📊</span>
                    <span>项目概览</span>
                </div>
                <div class="nav-item" onclick="showView('modules')" data-view="modules">
                    <div class="nav-progress"></div>
                    <span class="icon">📦</span>
                    <span>模块清单</span>
                    <span class="count" id="moduleCount">0</span>
                </div>
                <div class="nav-item" onclick="showView('documents')" data-view="documents">
                    <div class="nav-progress"></div>
                    <span class="icon">📝</span>
                    <span>文档中心</span>
                    <span class="count" id="docCount">0</span>
                </div>
            </div>

            <div class="nav-section" id="categoryNav">
                <div class="nav-header">分类</div>
                <!-- 动态生成 -->
            </div>

            <div class="nav-section">
                <div class="nav-header">项目</div>
                <div class="nav-item" onclick="showView('changelog')" data-view="changelog">
                    <div class="nav-progress"></div>
                    <span class="icon">🕐</span>
                    <span>更新日志</span>
                </div>
                <div class="nav-item" onclick="showView('about')" data-view="about">
                    <div class="nav-progress"></div>
                    <span class="icon">ℹ️</span>
                    <span>关于</span>
                </div>
            </div>
        </aside>

        <main class="main" id="mainContent">
            <!-- 动态内容 -->
        </main>
    </div>

    <script>
        let wikiData = null;
        let currentView = 'dashboard';
        let currentCategory = null;
        let currentDocId = null;

        // 加载数据
        async function loadData() {
            try {
                const res = await fetch('data/wiki-data.json');
                wikiData = await res.json();
                initApp();
            } catch (e) {
                document.getElementById('mainContent').innerHTML = `
                    <div style="padding:40px;text-align:center;color:var(--text-muted)">
                        <div style="font-size:48px;margin-bottom:16px">⚠️</div>
                        <h2>数据加载失败</h2>
                        <p>无法加载 wiki-data.json，请检查文件路径</p>
                        <p style="margin-top:16px;font-size:12px">${e.message}</p>
                    </div>
                `;
            }
        }

        function initApp() {
            renderCategoryNav();
            updateCounts();
            showView('dashboard');
        }

        function renderCategoryNav() {
            const nav = document.getElementById('categoryNav');
            let html = '<div class="nav-header">分类</div>';
            wikiData.categories.forEach(cat => {
                const count = wikiData.modules.filter(m => m.category === cat.id).length +
                              wikiData.documents.filter(d => d.category === cat.id).length;
                html += `
                    <div class="nav-item" onclick="showCategory('${cat.id}')" data-category="${cat.id}">
                        <div class="nav-progress"></div>
                        <span class="icon">${cat.icon}</span>
                        <span>${cat.name}</span>
                        <span class="count">${count}</span>
                    </div>
                `;
            });
            nav.innerHTML = html;
        }

        function updateCounts() {
            document.getElementById('moduleCount').textContent = wikiData.modules.length;
            document.getElementById('docCount').textContent = wikiData.documents.length;
        }

        function showView(view) {
            currentView = view;
            currentCategory = null;
            currentDocId = null;
            updateNavActive();

            const main = document.getElementById('mainContent');
            main.innerHTML = '';

            switch(view) {
                case 'dashboard': renderDashboard(main); break;
                case 'modules': renderModules(main); break;
                case 'documents': renderDocuments(main); break;
                case 'changelog': renderChangelog(main); break;
                case 'about': renderAbout(main); break;
            }

            if (window.innerWidth < 900) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function showCategory(catId) {
            currentCategory = catId;
            currentView = 'category';
            currentDocId = null;
            updateNavActive();

            const cat = wikiData.categories.find(c => c.id === catId);
            const modules = wikiData.modules.filter(m => m.category === catId);
            const docs = wikiData.documents.filter(d => d.category === catId);

            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="content-view animate-in">
                    <div class="page-header">
                        <h1>${cat.icon} ${cat.name}</h1>
                        <p>${cat.description}</p>
                    </div>
                    ${docs.length > 0 ? `
                        <div class="progress-section">
                            <div class="section-title">📄 文档</div>
                            <div class="module-grid">
                                ${docs.map(doc => renderDocCard(doc)).join('')}
                            </div>
                        </div>
                    ` : ''}
                    ${modules.length > 0 ? `
                        <div class="progress-section">
                            <div class="section-title">🔧 模块</div>
                            <div class="module-grid">
                                ${modules.map(m => renderModuleCard(m)).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            if (window.innerWidth < 900) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

            const inProgress = wikiData.modules.filter(m => m.status === '进行中').length;

            container.innerHTML = `
                <div class="dashboard animate-in">
                    <div class="page-header">
                        <h1>📊 项目概览</h1>
                        <p>${wikiData.project.description} — 当前版本 ${wikiData.project.version}，状态：${wikiData.project.status}</p>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">总模块</div>
                            <div class="stat-value">${totalModules}</div>
                            <div class="stat-sub">${completedModules} 已完成 · ${inProgress} 进行中</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">整体进度</div>
                            <div class="stat-value">${totalProgress}%</div>
                            <div class="stat-sub">基于模块完成度加权</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">文档数</div>
                            <div class="stat-value">${wikiData.documents.length}</div>
                            <div class="stat-sub">${wikiData.documents.filter(d => d.status === 'draft').length} 草稿 · ${wikiData.documents.filter(d => d.status === 'published').length} 已发布</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">预估成本</div>
                            <div class="stat-value" style="font-size:24px;margin-top:4px">¥600-800</div>
                            <div class="stat-sub">硬件BOM清单</div>
                        </div>
                    </div>

                    <div class="progress-section">
                        <div class="section-title">📈 整体进度</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${totalProgress}%"></div>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)">
                            <span>0%</span>
                            <span>50%</span>

        function renderModuleCard(m) {
            return `

                    </div>
                    <div class="module-desc">${m.description}</div>
                    <div class="module-meta">
                        <span class="priority-${m.priority}">● ${m.priority === 'high' ? '高' : m.priority === 'medium' ? '中' : '低'}优先级</span>
                        <div class="module-progress">

        function renderDocCard(doc) {

                    <div class="module-desc">${doc.content.substring(0, 120).replace(/[#*|]/g, '').trim()}...</div>

        function renderModules(container) {
            const grouped = {};
            wikiData.categories.forEach(c => grouped[c.id] = []);

                grouped[m.category].push(m);

                    </div>
            `;

                const mods = grouped[cat.id] || [];
                if (mods.length === 0) return;
                const catProgress = Math.round(mods.reduce((s, m) => s + m.progress, 0) / mods.length);

                html += `
                    <div class="progress-section">
                        <div class="section-title">${cat.icon} ${cat.name} <span style="color:var(--text-muted);font-weight:400">— ${catProgress}%</span></div>
                        <div class="module-grid">

            html += '</div>';
            container.innerHTML = html;

                    <div class="doc-content">
                        <h1>Robot Vacuum Wiki</h1>

        function handleSearch(query) {
            query = query.toLowerCase().trim();
            const main = document.getElementById('mainContent');

            if (!query) {
                showView(currentView);
                return;
            }

            const results = [];

            // 搜索模块
            wikiData.modules.forEach(m => {
                if (m.name.toLowerCase().includes(query) ||
                    m.description.toLowerCase().includes(query)) {
                    results.push({ type: 'module', item: m });
                }
            });

            // 搜索文档
            wikiData.documents.forEach(d => {
                if (d.title.toLowerCase().includes(query) ||
                    d.content.toLowerCase().includes(query)) {
                    results.push({ type: 'doc', item: d });
                }
            });

            // 搜索分类
            wikiData.categories.forEach(c => {
                if (c.name.toLowerCase().includes(query) ||
                    c.description.toLowerCase().includes(query)) {
                    results.push({ type: 'category', item: c });
                }
            });

            main.innerHTML = `
                <div class="dashboard animate-in">
                    <div class="page-header">
                        <h1>🔍 搜索结果</h1>
                        <p>"${query}" — 找到 ${results.length} 个结果</p>
                    </div>
                    ${results.length === 0 ? `
                        <div style="text-align:center;padding:60px;color:var(--text-muted)">
                            <div style="font-size:48px;margin-bottom:16px">🔭</div>
                            <p>没有找到匹配的结果</p>
                        </div>
                    ` : results.map(r => {
                        if (r.type === 'module') {
                            return `
                                <div class="result-item" onclick="showModuleDetail('${r.item.id}')">
                                    <div class="result-title">🔧 ${r.item.name}</div>
                                    <div class="result-snippet">${r.item.description}</div>
                                    <div class="result-meta">模块 · ${r.item.status} · ${r.item.progress}%</div>
                                </div>
                            `;
                        } else if (r.type === 'doc') {
                            const snippet = r.item.content.replace(/[#*|]/g, '').substring(0, 200);
                            return `
                                <div class="result-item" onclick="showDocument('${r.item.id}')">
                                    <div class="result-title">📝 ${r.item.title}</div>
                                    <div class="result-snippet">${snippet}...</div>
                                    <div class="result-meta">文档 · ${wikiData.categories.find(c => c.id === r.item.category)?.name || r.item.category}</div>
                                </div>
                            `;
                        } else {
                            return `
                                <div class="result-item" onclick="showCategory('${r.item.id}')">
                                    <div class="result-title">${r.item.icon} ${r.item.name}</div>
                                    <div class="result-snippet">${r.item.description}</div>
                                    <div class="result-meta">分类</div>
                                </div>
                            `;
                        }
                    }).join('')}
                </div>
            `;
        }

        function updateNavActive() {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                if (currentView && el.dataset.view === currentView) {
                    el.classList.add('active');
                }
                if (currentCategory && el.dataset.category === currentCategory) {
                    el.classList.add('active');
                }
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.querySelector('.theme-btn');
            if (html.dataset.theme === 'light') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                html.dataset.theme = 'light';
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }

        // 逐行 Markdown 解析（更可靠）
        function markdownToHtml(md) {
            const lines = md.split('\n');
            const result = [];
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];

                // 空行
                if (line.trim() === '') {
                    i++;
                    continue;
                }

                // H1
                if (line.match(/^#\s/)) {
                    result.push('<h1>' + inlineFmt(line.replace(/^#\s*/, '')) + '</h1>');
                    i++;
                    continue;
                }

                // H2
                if (line.match(/^##\s/)) {
                    result.push('<h2>' + inlineFmt(line.replace(/^##\s*/, '')) + '</h2>');
                    i++;
                    continue;
                }

                // H3
                if (line.match(/^###\s/)) {
                    result.push('<h3>' + inlineFmt(line.replace(/^###\s*/, '')) + '</h3>');
                    i++;
                    continue;
                }

                // 分隔线 ---
                if (line.match(/^---+$/)) {
                    result.push('<hr style="border:none;border-top:1px solid var(--border);margin:24px 0;">');
                    i++;
                    continue;
                }

                // Blockquote
                if (line.match(/^>\s/)) {
                    const bqLines = [];
                    while (i < lines.length && lines[i].match(/^>\s?/)) {
                        bqLines.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    result.push('<blockquote>' + inlineFmt(bqLines.join('\n')) + '</blockquote>');
                    continue;
                }

                // 表格
                if (line.match(/^\|.*\|$/)) {
                    const tableLines = [];
                    while (i < lines.length && lines[i].match(/^\|.*\|$/)) {
                        tableLines.push(lines[i]);
                        i++;
                    }
                    result.push(renderTable(tableLines));
                    continue;
                }

                // 无序列表
                if (line.match(/^[-*+]\s/)) {
                    const listItems = [];
                    while (i < lines.length && lines[i].match(/^[-*+]\s/)) {
                        listItems.push('<li>' + inlineFmt(lines[i].replace(/^[-*+]\s/, '')) + '</li>');
                        i++;
                    }
                    result.push('<ul>' + listItems.join('') + '</ul>');
                    continue;
                }

                // 有序列表
                if (line.match(/^\d+\.\s/)) {
                    const listItems = [];
                    while (i < lines.length && lines[i].match(/^\d+\.\s/)) {
                        listItems.push('<li>' + inlineFmt(lines[i].replace(/^\d+\.\s/, '')) + '</li>');
                        i++;
                    }
                    result.push('<ol>' + listItems.join('') + '</ol>');
                    continue;
                }

                // 代码块
                if (line.match(/^```/)) {
                    const lang = line.replace(/^```/, '').trim();
                    const codeLines = [];
                    i++;
                    while (i < lines.length && !lines[i].match(/^```/)) {
                        codeLines.push(escapeHtml(lines[i]));
                        i++;
                    }
                    i++; // skip closing ```
                    result.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
                    continue;
                }

                // 普通段落
                const paraLines = [];
                while (i < lines.length && lines[i].trim() !== '' && !lines[i].match(/^#{1,3}\s|^[-*+>]\s|^\d+\.\s|^```|^\|.*\|$/)) {
                    paraLines.push(lines[i]);
                    i++;
                }
                result.push('<p>' + inlineFmt(paraLines.join(' ')) + '</p>');
            }

            return result.join('\n');
        }

        function inlineFmt(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        }

        function renderTable(lines) {
            // 过滤掉分隔行 |---|---|
            const dataLines = lines.filter(l => !l.replace(/\|/g, '').trim().match(/^[-:\s]+$/));
            if (dataLines.length === 0) return '';

            let html = '<div class="table-wrap"><table>';
            dataLines.forEach((line, idx) => {
                const cells = line.split('|').map(c => c.trim()).filter(c => c !== '');
                const tag = idx === 0 ? 'th' : 'td';
                html += '<tr>' + cells.map(c => '<' + tag + '>' + inlineFmt(c) + '</' + tag + '>').join('') + '</tr>';
            });
            html += '</table></div>';
            return html;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 初始化主题
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.dataset.theme = 'light';
            document.querySelector('.theme-btn').textContent = '☀️';
        }

        // 加载数据
        loadData();
    </script>
