<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <!-- 机身 -->
  <rect x="120" y="90" width="160" height="50" rx="10" fill="#34495e"/>
  
  <!-- 左侧履带 -->
  <rect x="80" y="100" width="30" height="80" rx="5" fill="none" stroke="#2c3e50" stroke-width="4"/>
  <line x1="85" y1="110" x2="85" y2="170" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="95" y1="110" x2="95" y2="170" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="105" y1="110" x2="105" y2="170" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- 右侧轮子 -->
  <circle cx="310" cy="150" r="25" fill="none" stroke="#2c3e50" stroke-width="4"/>
  <circle cx="310" cy="150" r="10" fill="none" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="310" y1="125" x2="310" y2="175" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="285" y1="150" x2="335" y2="150" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- 前侧腿（足式） -->
  <line x1="160" y1="140" x2="150" y2="180" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="180" x2="140" y2="200" stroke="#7f8c8d" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="136" cy="203" rx="8" ry="4" fill="#2c3e50"/>
  
  <!-- 模式切换箭头 -->
  <path d="M 200 60 L 200 40" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e74c3c">模式切换</text>
  
  <!-- 图例 -->
  <rect x="20" y="20" width="15" height="15" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <text x="42" y="32" font-family="sans-serif" font-size="11" fill="#333">履带模式（爬楼梯）</text>
  
  <circle cx="27" cy="55" r="8" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <text x="42" y="60" font-family="sans-serif" font-size="11" fill="#333">轮式模式（平地）</text>
  
  <line x1="20" y1="80" x2="34" y2="80" stroke="#7f8c8d" stroke-width="3"/>
  <text x="42" y="84" font-family="sans-serif" font-size="11" fill="#333">腿式模式（复杂地形）</text>
  
  <!-- 地面 -->
  <line x1="20" y1="210" x2="380" y2="210" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- 标签 -->
  <text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">复合式：轮-履-足多模态组合，根据地形自动切换最优模式</text>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>