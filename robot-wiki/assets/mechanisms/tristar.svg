<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- 中心轴 -->
  <circle cx="150" cy="140" r="8" fill="#333"/>
  
  <!-- 三个轮子的中心点 -->
  <circle cx="150" cy="60" r="6" fill="#666"/>
  <circle cx="81" cy="180" r="6" fill="#666"/>
  <circle cx="219" cy="180" r="6" fill="#666"/>
  
  <!-- 连接杆 -->
  <line x1="150" y1="140" x2="150" y2="60" stroke="#333" stroke-width="4"/>
  <line x1="150" y1="140" x2="81" y2="180" stroke="#333" stroke-width="4"/>
  <line x1="150" y1="140" x2="219" y2="180" stroke="#333" stroke-width="4"/>
  
  <!-- 三个轮子 -->
  <circle cx="150" cy="40" r="22" fill="none" stroke="#2c3e50" stroke-width="4"/>
  <circle cx="61" cy="195" r="22" fill="none" stroke="#2c3e50" stroke-width="4"/>
  <circle cx="239" cy="195" r="22" fill="none" stroke="#2c3e50" stroke-width="4"/>
  
  <!-- 旋转箭头 -->
  <path d="M 200 80 A 60 60 0 0 0 100 80" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="100,80 95,72 108,76" fill="#e74c3c"/>
  
  <!-- 台阶示意 -->
  <rect x="20" y="230" width="260" height="15" fill="#ddd" stroke="#999"/>
  <!-- 接触点 -->
  <circle cx="61" cy="230" r="4" fill="#e74c3c"/>
  
  <!-- 标签 -->
  <text x="150" y="265" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">行星轮组：三星轮绕中心旋转，翻越障碍时整组翻转</text>
</svg>