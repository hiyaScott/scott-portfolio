<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <!-- 机身 -->
  <rect x="90" y="70" width="120" height="50" rx="8" fill="#34495e"/>
  
  <!-- 头部/传感器 -->
  <rect x="200" y="80" width="25" height="30" rx="4" fill="#2c3e50"/>
  <circle cx="220" cy="90" r="4" fill="#e74c3c"/>
  
  <!-- 四条腿 -->
  <!-- 前左腿 -->
  <line x1="100" y1="120" x2="80" y2="160" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="160" x2="70" y2="190" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="68" cy="195" rx="10" ry="5" fill="#2c3e50"/>
  
  <!-- 前右腿 -->
  <line x1="140" y1="120" x2="150" y2="160" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="160" x2="155" y2="190" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="157" cy="195" rx="10" ry="5" fill="#2c3e50"/>
  
  <!-- 后左腿 -->
  <line x1="160" y1="120" x2="170" y2="160" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="160" x2="175" y2="190" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="177" cy="195" rx="10" ry="5" fill="#2c3e50"/>
  
  <!-- 后右腿 -->
  <line x1="200" y1="120" x2="220" y2="160" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="160" x2="230" y2="190" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="233" cy="195" rx="10" ry="5" fill="#2c3e50"/>
  
  <!-- 关节点 -->
  <circle cx="80" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="150" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="170" cy="160" r="4" fill="#e74c3c"/>
  <circle cx="220" cy="160" r="4" fill="#e74c3c"/>
  
  <!-- 地面 -->
  <line x1="20" y1="200" x2="280" y2="200" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- 标签 -->
  <text x="150" y="20" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">四足机器人：仿生多足行走，交替支撑实现稳定攀爬</text>
</svg>