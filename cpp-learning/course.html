<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程详情 - C++ 核心课程</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="course-page">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="back-link">← 返回课程列表</a>
    </div>
    <div class="nav-title" id="navTitle">课程详情</div>
  </nav>

  <!-- 课程主体 -->
  <main class="course-main">
    <!-- 左侧/上方：视频 -->
    <section class="video-section">
      <!-- 外部视频嵌入模式 -->
      <div class="video-wrapper external-video" id="externalVideoBox" style="display: none;">
        <iframe id="externalVideoFrame" src="" frameborder="0" allowfullscreen></iframe>
        <div class="external-video-bar">
          <span id="externalVideoNote"></span>
          <a id="externalVideoLink" href="" target="_blank" rel="noopener">↗ 新窗口打开</a>
        </div>
      </div>

      <!-- 本地视频模式 -->
      <div class="video-wrapper local-video" id="localVideoBox">
        <video id="courseVideo" controls poster="">
          <source src="" type="video/mp4">
          <p>你的浏览器不支持视频播放。</p>
        </video>
      </div>
      <div class="video-info">
        <h1 id="courseTitle">课程标题</h1>
        <div class="course-meta">
          <span class="level-badge" id="courseLevel">入门</span>
          <span class="duration" id="courseDuration">--</span>
          <span class="tags" id="courseTags"></span>
        </div>
        <p class="course-desc" id="courseDesc">课程描述</p>
      </div>
    </section>

    <!-- 右侧/下方：PDF -->
    <section class="pdf-section">
      <div class="pdf-header">
        <h3>📄 课程资料</h3>
        <a id="pdfDownload" href="" download class="download-btn">下载 PDF</a>
      </div>
      <div class="pdf-viewer">
        <iframe id="pdfFrame" src="" frameborder="0"></iframe>
      </div>
    </section>
  </main>

  <!-- 课程切换 -->
  <nav class="lesson-nav" id="lessonNav">
    <!-- 上下课导航由 JS 渲染 -->
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
