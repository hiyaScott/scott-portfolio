<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>习题讲解 - C++ 核心课程</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="walkthrough-page">
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="back-link">← 返回课程列表</a>
    </div>
    <div class="nav-title" id="navTitle">习题讲解</div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
  </nav>

  <!-- 页面头部 -->
  <header class="wt-header">
    <div class="wt-header-inner">
      <div class="wt-date" id="wtDate"></div>
      <h1 class="wt-title" id="wtTitle">习题讲解</h1>
      <p class="wt-intro" id="wtIntro"></p>

      <!-- 完成进度 -->
      <div class="wt-progress" id="wtProgress">
        <span class="wt-progress-label">完成进度</span>
        <div class="progress-bar-track wt-progress-track">
          <div class="progress-bar-fill" id="wtProgressBar"></div>
        </div>
        <span class="progress-count" id="wtProgressCount">0 / 0</span>
      </div>

      <!-- 题目导航 -->
      <nav class="wt-nav" id="wtNav"></nav>
    </div>
  </header>

  <!-- 正文 -->
  <main class="wt-content" id="wtContent">
    <!-- 由 JS 渲染 -->
  </main>

  <footer class="footer">
    <p>C++ 核心课程 · 由 Scott 制作</p>
  </footer>

  <!-- 二次确认对话框（与课程页共用逻辑） -->
  <div class="confirm-dialog" id="confirmDialog" style="display:none">
    <div class="confirm-dialog-overlay" onclick="closeConfirmDialog()"></div>
    <div class="confirm-dialog-box">
      <div class="confirm-dialog-title" id="confirmDialogTitle">确认操作</div>
      <div class="confirm-dialog-message" id="confirmDialogMessage"></div>
      <div class="confirm-dialog-actions">
        <button class="confirm-dialog-btn confirm-dialog-cancel" onclick="closeConfirmDialog()">取消</button>
        <button class="confirm-dialog-btn confirm-dialog-confirm" id="confirmDialogConfirmBtn">确认</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
